[project]
name = "be-agent-orchestrator"
version = "0.1.0"
description = "Yuno AI Agent Orchestration Platform — backend (FastAPI + LangGraph + Postgres + Redis + Arq)"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.136.1",
    "google-genai>=1.75.0",
    "groq>=1.2.0",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.4.3",
    "langchain-core>=1.4.0",
    "langchain-google-genai>=4.2.3",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.1",
    "mem0ai>=0.1.114",
    "neo4j>=5.28.1",
    "psycopg[binary,pool]>=3.2.10",
    # mem0's huggingface embedder lazy-imports this at add/search time.
    # Without it every memory op silently no-ops via our exception swallow.
    "sentence-transformers>=3.3.1",
    "openai>=2.38.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.29",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.0.49",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.47.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "freezegun>=1.5.5",
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.14",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI relies on calling these in argument defaults — it's the canonical pattern.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Alembic autogenerates these with loose SQLAlchemy types; not hand-written.
module = "app.db.migrations.versions.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
