server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Long-cache hashed assets (Vite outputs content-hashed filenames)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback — let the client router handle unknown paths
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API reverse-proxy. The FE's API client hits /api/v1/* (set via
  # VITE_API_BASE_URL at build time); nginx forwards to the api
  # container resolved by docker's service discovery. Single-origin =
  # no CORS pre-flights, no cookie-domain headaches.
  location /api/ {
    proxy_pass         http://api:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # Long-poll-friendly: turn off proxy buffering so SSE / WebSocket
    # responses stream as they arrive.
    proxy_buffering    off;
    proxy_read_timeout 300s;
  }

  # Gzip
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  # Don't leak nginx version
  server_tokens off;
}
