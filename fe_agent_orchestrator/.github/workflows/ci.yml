name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: fe_agent_orchestrator

jobs:
  analyze:
    name: Analyze (typecheck + lint + format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fe_agent_orchestrator/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run analyze
        run: make analyze

      - name: Upload analyze log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-log
          path: fe_agent_orchestrator/logs/analyze.log
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fe_agent_orchestrator/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: make build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: fe_agent_orchestrator/dist
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (load locally, no push)
        uses: docker/build-push-action@v6
        with:
          context: fe_agent_orchestrator
          push: false
          load: true
          tags: yuno/fe_agent_orchestrator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
